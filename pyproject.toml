[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcell-auto-verify"
version = "0.1.0"
description = "A PySide6 desktop manager for discovering PCells in open PDKs"
requires-python = ">=3.10"
dependencies = [
    "docopt>=0.6.2",
    "numpy>=1.24",
    "PySide6>=6.6",
]

[project.scripts]
pcell-auto-verify = "core.application:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "database*", "gui*", "plugins*"]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]
